name: Draft daily edition
# The Worker parses this title to see which topics a queued or running edition already covers.
run-name: "Draft edition: ${{ inputs.topics || 'all topics' }}"

# On demand only. A reader's "See today's paper" tap reaches the Worker (worker/src/index.ts, POST /curate),
# which dispatches this workflow with just the topics nobody has generated yet today. There is no
# schedule: a day with no taps writes nothing and spends nothing. You can still run it by hand from
# the Actions tab (blank topics = every topic not already ready today).
#
# The job researches each topic with Gemini + Google Search, writes stories in the Penpost writers'
# voices, holds any story the checker can't match to its sources, and publishes the rest straight to
# main. Topic progress lives in content/topics/<date>.json (pending -> ready), so a second reader
# never pays for the same topic twice.
on:
  workflow_dispatch:
    inputs:
      date:
        description: "Edition date (YYYY-MM-DD, America/Chicago). Leave blank for today."
        required: false
      max_stories:
        description: "Most stories to publish (default 30)."
        required: false
      topics:
        description: "Only these topic IDs, comma separated (e.g. local-twin-cities,mn-sports). Blank for all."
        required: false
      dry_run:
        description: "Research and write, but don't publish."
        type: boolean
        default: false

permissions:
  contents: write
  actions: write

jobs:
  # Mark the requested topics pending right away, even while another edition run is still writing,
  # so a second tap sees "pending" and doesn't pay again. Not in the concurrency group on purpose.
  claim:
    if: github.ref == 'refs/heads/main' && !inputs.dry_run
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Mark topics pending
        env:
          EDITION_DATE: ${{ inputs.date }}
          TOPICS: ${{ inputs.topics }}
        run: bash pipeline/push-topics.sh claim

  draft:
    needs: claim
    # Runs after the claim, or without it for dry runs and other branches.
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 75
    # One edition run at a time. GitHub keeps only the newest queued run; topics claimed by a
    # replaced run stay "pending" in the manifest and the next run picks them up.
    concurrency:
      group: draft-edition
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          # The latest main, not the commit the run was dispatched at: it has the newest topic manifest.
          ref: ${{ github.ref == 'refs/heads/main' && 'main' || github.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - name: Plan topics
        id: plan
        env:
          EDITION_DATE: ${{ inputs.date }}
          TOPICS: ${{ inputs.topics }}
        run: |
          date="${EDITION_DATE:-$(TZ=America/Chicago date +%F)}"
          topics="$(npx tsx pipeline/topics.ts plan --date "$date" --topics "$TOPICS")"
          echo "date=$date" >> "$GITHUB_OUTPUT"
          echo "topics=$topics" >> "$GITHUB_OUTPUT"
          echo "Topics for $date: ${topics:-none (all ready already)}"

      - name: Research and write stories
        if: steps.plan.outputs.topics != ''
        env:
          PENPOST_PROVIDER: gemini
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          # Optional: free key from unsplash.com/developers for stock photos.
          UNSPLASH_ACCESS_KEY: ${{ secrets.UNSPLASH_ACCESS_KEY }}
          # Set these as repository variables to change models without editing code.
          PENPOST_TRIAGE_MODEL: ${{ vars.PENPOST_TRIAGE_MODEL }}
          PENPOST_WRITER_MODEL: ${{ vars.PENPOST_WRITER_MODEL }}
          PENPOST_FALLBACK_MODEL: ${{ vars.PENPOST_FALLBACK_MODEL }}
          PENPOST_MAX_CALLS: ${{ vars.PENPOST_MAX_CALLS || '300' }}
          PENPOST_TOPICS: ${{ steps.plan.outputs.topics }}
        run: >-
          npx tsx pipeline/agent.ts
          --date ${{ steps.plan.outputs.date }}
          ${{ inputs.max_stories && format('--max-stories {0}', inputs.max_stories) || '' }}

      - name: Validate content
        if: steps.plan.outputs.topics != ''
        run: npm run validate

      - name: Summary
        id: summary
        if: steps.plan.outputs.topics != ''
        run: |
          echo "changes=$(cat pipeline/out/has-changes)" >> "$GITHUB_OUTPUT"
          cat pipeline/out/summary.md >> "$GITHUB_STEP_SUMMARY"

      # Commits the stories and edition, then marks the topics ready (or failed) in the manifest.
      - name: Publish to main
        if: steps.plan.outputs.topics != '' && github.ref == 'refs/heads/main' && !inputs.dry_run
        env:
          EDITION_DATE: ${{ steps.plan.outputs.date }}
        run: bash pipeline/push-topics.sh finish

      # Pushes made with the workflow token don't trigger other workflows, so start the deploy directly.
      - name: Deploy the site
        if: steps.summary.outputs.changes == 'true' && github.ref == 'refs/heads/main' && !inputs.dry_run
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy.yml --ref main
