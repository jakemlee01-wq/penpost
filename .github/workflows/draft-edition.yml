name: Draft daily edition

# Weekday mornings. Cron runs in UTC: 10:20 UTC is 5:20 a.m. Central in summer
# and 4:20 a.m. in winter.
#
# The job researches every region and interest with Gemini + Google Search, writes stories in the
# Penpost writers' voices, holds any story the checker can't match to its sources, and publishes
# the rest straight to main. There is no review step.
on:
  schedule:
    - cron: "20 10 * * 1-5"
  workflow_dispatch:
    inputs:
      date:
        description: "Edition date (YYYY-MM-DD, America/Chicago). Leave blank for today."
        required: false
      max_stories:
        description: "Most stories to publish (default 30)."
        required: false
      dry_run:
        description: "Research and write, but don't publish."
        type: boolean
        default: false

permissions:
  contents: write
  actions: write

concurrency:
  group: draft-edition
  cancel-in-progress: false

jobs:
  draft:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - name: Research and write stories
        env:
          PENPOST_PROVIDER: gemini
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          # Optional: free key from unsplash.com/developers for stock photos.
          UNSPLASH_ACCESS_KEY: ${{ secrets.UNSPLASH_ACCESS_KEY }}
          # Set these as repository variables to change models without editing code.
          PENPOST_TRIAGE_MODEL: ${{ vars.PENPOST_TRIAGE_MODEL }}
          PENPOST_WRITER_MODEL: ${{ vars.PENPOST_WRITER_MODEL }}
          PENPOST_FALLBACK_MODEL: ${{ vars.PENPOST_FALLBACK_MODEL }}
          PENPOST_MAX_CALLS: ${{ vars.PENPOST_MAX_CALLS || '200' }}
        run: >-
          npx tsx pipeline/agent.ts
          ${{ inputs.date && format('--date {0}', inputs.date) || '' }}
          ${{ inputs.max_stories && format('--max-stories {0}', inputs.max_stories) || '' }}

      - name: Validate content
        run: npm run validate

      - name: Summary
        id: summary
        run: |
          echo "changes=$(cat pipeline/out/has-changes)" >> "$GITHUB_OUTPUT"
          cat pipeline/out/summary.md >> "$GITHUB_STEP_SUMMARY"

      - name: Publish to main
        if: steps.summary.outputs.changes == 'true' && github.ref == 'refs/heads/main' && !inputs.dry_run
        run: |
          git config user.name "penpost-bot"
          git config user.email "penpost-bot@users.noreply.github.com"
          git add content/stories content/editions
          git commit -m "Edition $(TZ=America/Chicago date +%F)"
          git pull --rebase origin main
          git push origin HEAD:main

      # Pushes made with the workflow token don't trigger other workflows, so start the deploy directly.
      - name: Deploy the site
        if: steps.summary.outputs.changes == 'true' && github.ref == 'refs/heads/main' && !inputs.dry_run
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy.yml --ref main
