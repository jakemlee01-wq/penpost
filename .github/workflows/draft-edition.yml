name: Draft daily edition

# Weekday mornings. Cron runs in UTC: 09:00 UTC is 4:00 a.m. Central in summer
# and 3:00 a.m. in winter, so the edition is live before the 5:00 a.m. check.
#
# The job researches every region and interest with Gemini + Google Search, writes stories in the
# Penpost writers' voices, holds any story the checker can't match to its sources, and publishes
# the rest straight to main. There is no review step.
on:
  schedule:
    - cron: "0 9 * * 1-5"
  workflow_dispatch:
    inputs:
      date:
        description: "Edition date (YYYY-MM-DD, America/Chicago). Leave blank for today."
        required: false
      max_stories:
        description: "Most stories to publish (default 30)."
        required: false
      topics:
        description: "Only these topic IDs, comma separated (e.g. local-twin-cities,mn-sports). Blank for all."
        required: false
      dry_run:
        description: "Research and write, but don't publish."
        type: boolean
        default: false

permissions:
  contents: write
  actions: write

concurrency:
  group: draft-edition
  cancel-in-progress: false

jobs:
  draft:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - name: Research and write stories
        env:
          PENPOST_PROVIDER: gemini
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          # Optional: free key from unsplash.com/developers for stock photos.
          UNSPLASH_ACCESS_KEY: ${{ secrets.UNSPLASH_ACCESS_KEY }}
          # Set these as repository variables to change models without editing code.
          PENPOST_TRIAGE_MODEL: ${{ vars.PENPOST_TRIAGE_MODEL }}
          PENPOST_WRITER_MODEL: ${{ vars.PENPOST_WRITER_MODEL }}
          PENPOST_FALLBACK_MODEL: ${{ vars.PENPOST_FALLBACK_MODEL }}
          PENPOST_MAX_CALLS: ${{ vars.PENPOST_MAX_CALLS || '300' }}
          PENPOST_TOPICS: ${{ inputs.topics }}
        run: >-
          npx tsx pipeline/agent.ts
          ${{ inputs.date && format('--date {0}', inputs.date) || '' }}
          ${{ inputs.max_stories && format('--max-stories {0}', inputs.max_stories) || '' }}

      - name: Validate content
        run: npm run validate

      - name: Summary
        id: summary
        run: |
          echo "changes=$(cat pipeline/out/has-changes)" >> "$GITHUB_OUTPUT"
          cat pipeline/out/summary.md >> "$GITHUB_STEP_SUMMARY"

      - name: Publish to main
        if: steps.summary.outputs.changes == 'true' && github.ref == 'refs/heads/main' && !inputs.dry_run
        run: |
          git config user.name "penpost-bot"
          git config user.email "penpost-bot@users.noreply.github.com"
          git add content/stories content/editions
          git commit -m "Edition $(TZ=America/Chicago date +%F)"
          git pull --rebase origin main
          git push origin HEAD:main

      # Pushes made with the workflow token don't trigger other workflows, so start the deploy directly.
      - name: Deploy the site
        if: steps.summary.outputs.changes == 'true' && github.ref == 'refs/heads/main' && !inputs.dry_run
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy.yml --ref main

      # Runs last so a partial edition still publishes. A run that publishes nothing (out of
      # credits, bad key, every topic failing) goes red instead of looking like a quiet success.
      - name: Fail if the edition is empty
        if: ${{ !inputs.dry_run }}
        run: |
          published=$(cat pipeline/out/published 2>/dev/null || echo 0)
          if [ "$published" -eq 0 ]; then
            echo "::error title=Empty edition::0 stories published. Check the Research annotation for the cause (e.g. HTTP 402 means Gemini credits are depleted)."
            exit 1
          fi
