# Penpost Worker: setup parser (/parse) and on-demand editions (/curate). Deploy from the repo root:
#   npx wrangler deploy --config worker/wrangler.toml
#   npx wrangler secret put GEMINI_API_KEY --config worker/wrangler.toml
#   npx wrangler secret put GITHUB_TOKEN --config worker/wrangler.toml
# GITHUB_TOKEN: a fine-grained personal access token for jakemlee01-wq/penpost only, with
# Actions: read and write, Contents: read-only. Nothing else.
name = "penpost-setup"
main = "src/index.ts"
compatibility_date = "2025-09-01"

[vars]
ALLOWED_ORIGINS = "https://penpost.co,https://www.penpost.co,http://penpost.co,http://www.penpost.co,https://jakemlee01-wq.github.io,http://localhost:5173"
GEMINI_MODEL = "gemini-3.5-flash-lite"
GITHUB_REPO = "jakemlee01-wq/penpost"

# Each visitor gets 10 requests a minute across /parse, /curate and /curate/status.
# The app polls /curate/status about every 12 seconds while a paper is being curated.
[[ratelimits]]
name = "RATE_LIMITER"
namespace_id = "1001"

  [ratelimits.simple]
  limit = 10
  period = 60
